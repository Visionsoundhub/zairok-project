backend:
  name: github
  repo: Visionsoundhub/zairok-project
  branch: main
  base_url: https://zairok-auth.agent-d3f.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "settings"
    label: "⚙️ Settings"
    files:
      - name: "global"
        label: "Site Settings"
        file: "src/_data/settings.json"
        fields:
          - {label: "Site Logo (Image)", name: "site_logo", widget: "image", required: false}
          - {label: "Background Audio", name: "audio_loop", widget: "file", required: false}
          - {label: "Access Sound", name: "audio_access", widget: "file", required: false}
          - {label: "Audio Track Label", name: "audio_label", widget: "string", default: "ENCRYPTED_SIGNAL.log"}
          - {label: "Scan Text (Start)", name: "scan_start_text", widget: "string"}
          - {label: "Scan Text (Success)", name: "scan_success_text", widget: "string"}
          - {label: "Main Accent Color (Neon)", name: "color_accent", widget: "color", default: "#ff8c00"}
          - {label: "Error/Alert Color (Red)", name: "color_error", widget: "color", default: "#ff003c"}
          
          - label: "📱 SEO & SOCIAL MEDIA (Κοινοποιήσεις)"
            name: "seo"
            widget: "object"
            collapsed: false
            fields:
              - {label: "Favicon (Μικρό εικονίδιο δίπλα στον τίτλο)", name: "favicon", widget: "image", required: false}
              - {label: "Εικόνα Κοινοποίησης (Thumbnail για Facebook/Instagram)", name: "og_image", widget: "image", required: false}
              - {label: "Περιγραφή Κοινοποίησης (Τι θα γράφει κάτω από τον τίτλο)", name: "description", widget: "text", default: "Το ψηφιακό δίκτυο άνοιξε. Επίλεξε το επίπεδό σου και μπες στην Αντίσταση.", required: false}

  - name: "pages"
    label: "📄 Pages"
    folder: "src/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "base.njk"}
      - {label: "ΤΙΤΛΟΣ ΣΕΛΙΔΑΣ", name: "title", widget: "string"}
      - {label: "PERMALINK", name: "permalink", widget: "string"}
      - {label: "ΕΜΦΑΝΙΣΗ ΣΤΟ ΜΕΝΟΥ;", name: "in_menu", widget: "boolean", default: true}
      - {label: "ΕΜΦΑΝΙΣΗ SECURITY GATE; (Access Granted)", name: "require_gate", widget: "boolean", default: false}
      - label: "PAGE BLOCKS"
        name: "blocks"
        widget: "list"
        types:
          - label: "Terminal Intro (Green Text)"
            name: "terminal_intro"
            widget: "object"
            fields:
              - {label: "Lines", name: "lines", widget: "list", field: {label: "Line", name: "line", widget: "string"}}

          - label: "VIP Chapter (Accordion)"
            name: "vip_chapter"
            widget: "object"
            fields:
              - {label: "Chapter Title", name: "title", widget: "string"}
              - {label: "Chapter Content", name: "content", widget: "markdown"}

          - label: "VIP Archive Button (Γενικό PDF)"
            name: "vip_archive_button"
            widget: "object"
            fields:
              - {label: "Κείμενο Κουμπιού", name: "button_text", widget: "string", default: "OFFLINE ARCHIVE DOWNLOAD"}
              - {label: "Link για PDF", name: "pdf_url", widget: "string"}

          - label: "VIP Feedback Form"
            name: "vip_feedback"
            widget: "object"
            fields:
              - {label: "Form Title", name: "title", widget: "string", default: "ΑΝΑΦΟΡΕΣ ΠΡΑΚΤΟΡΩΝ"}
              - {label: "Placeholder Text", name: "placeholder", widget: "string", default: "ΕΙΣΑΓΩΓΗ ΑΝΑΦΟΡΑΣ..."}

          - label: "Hero (Μεγάλα Γράμματα)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Status", name: "status", widget: "select", options: ["INIT", "INFO", "DATA", "SECRET", "ALERT", "ARCHIVE", "CLASSIFIED", "REDACTED"], default: "INIT"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button Text", name: "button_text", widget: "string", required: false}
              - {label: "Button URL", name: "button_url", widget: "string", required: false}

          - label: "Lore Section (Database Style)"
            name: "lore"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Items", name: "items", widget: "list", fields: [{label: "Item Title", name: "item_title", widget: "string"}, {label: "Item Desc", name: "item_desc", widget: "text"}]}

          - label: "Form (Εγγραφή)"
            name: "signup_form"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Desc", name: "desc", widget: "text"}
              - {label: "Form Type", name: "form_type", widget: "select", options: ["general", "resistance"]}

          - label: "🛒 Product (Gear Shop)"
            name: "product"
            widget: "object"
            fields:
              - {label: "Product Name", name: "title", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Product Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
              - {label: "Payhip Link", name: "payhip_url", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Status Label", name: "status", widget: "select", options: ["AVAILABLE", "LIMITED", "ENCRYPTED", "SOLD OUT"], default: "AVAILABLE"}

          - label: "Video / Image"
            name: "media_block"
            widget: "object"
            fields:
              - {label: "YouTube URL", name: "video", widget: "string", required: false}
              - {label: "Image", name: "image", widget: "image", required: false}

          - label: "Terminal (Dynamic)"
            name: "crt_terminal"
            widget: "object"
            fields:
              - {label: "Terminal Boot Text", name: "boot_text", widget: "text"}
              - {label: "Decrypted Document", name: "document_text", widget: "markdown"}

          - label: "Rich Text (Markdown)"
            name: "richtext"
            widget: "object"
            fields:
              - {label: "Body", name: "body", widget: "markdown"}
